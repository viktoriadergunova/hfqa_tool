version: "1.0"
schema_id: "hf_quality:v1"

# =====================================================
# STEP A — UNCERTAINTY SCORE (U-SCORE)
# =====================================================
u_score:

  calculation:
    value_col: "C1"            # Heat-flow value
    uncertainty_col: "C2"      # Heat-flow uncertainty
    site_name_col: "P3"        # Site / borehole identifier
    relevance_col: "C9"        # Child / Parent flag
    role_child: "[yes]"
    role_parent: "[no]"

  thresholds:
    U1: 5.0                    # < 5%
    U2: 15.0                   # 5–15%
    U3: 25.0                   # 15–25%
    U4: 100.0                  # >25%
    Ux: "missing"


# =====================================================
# STEP B — METHODOLOGICAL SCORE (M-SCORE)
# =====================================================
m_score:

  base_value: 1.0

  # ---------- REQUIRED FOR SCHEMA-DRIVEN CODE ----------
  calculation:
    # Parent / Child identification
    site_name_col: "P3"
    relevance_col: "C9"
    role_child: "[yes]"
    role_parent: "[no]"

    # Temperature gradient (borehole)
    t_method_top_col: "C31"
    t_method_bottom_col: "C32"
    t_number_col: "C37" # conditions  t_number_col>3

    # Thermal conductivity
    q_top_col: "C4"
    q_bottom_col: "C5"
    tc_location_col: "C42"
    tc_source_col: "C41"
    tc_number_col: "C47"
    tc_saturation_col: "C44"
    tc_pT_conditions_col: "C45"

  thresholds:
    M1: 0.75
    M2: 0.50
    M3: 0.25
    M4: 0.00
    missing_suffix: "x"

  # =====================================================
  # Borehole 
  # =====================================================
  borehole_logic:

    # -------------------------
    # Temperature gradient (T-score)
    # -------------------------
    temperature:
      start_value: 1.0

      cases:

        # Case 1 — Continuous log (C37 > 3)
        continuous_log:
          when:
            C37_T_number: ">3"
          rules:
            equilibrium_or_corrected:
              methods_any_of: ["[LOGeq]", "[cLOG]", "[DTSeq]", "[cDTS]"]
              penalty: 0.1
            perturbed:
              methods_any_of: ["[LOGpert]"]
              penalty: -0.1

        # Case 2 — Multiple single-point temperatures
        multiple_single_T_points:
          when: {} # no condition
          rules:
            equilibrium_or_corrected:
              methods_any_of: ["[LOGeq]", "[cLOG]", "[DTSeq]", "[cDTS]", "[BHT]", "[DST]", "[RTDeq]", "[RTDc]", "[ODTT-PC]", "[ODTT-TP]"]
              penalty: -0.1
            perturbed:
              methods_any_of: ["[LOGpert]", "[DTSpert]", "[BHT]", "[DST]", "[RTDpert]", "[BLK]"]
              penalty: -0.3
            estimated:
              methods_any_of: ["[CPD]", "[XEN]", "[GTM]", "[BSR]"]
              penalty: -0.5

        # Case 3 — One single point + surface temperature
        one_single_point_plus_surface_T:
          when:
            C31_T_method_top: "==[SUR]"
          rules:
            equilibrium_or_corrected:
              C32_methods_any_of: ["[cBHT]", "[cDST]", "[RTDeq]", "[RTDc]", "[ODTT-PC]", "[ODTT-TP]"] # TODO make sure c32 is only used 
              penalty: -0.3
            perturbed:
              C32_methods_any_of: ["[BHT]", "[DST]", "[RTDpert]"]
              penalty: -0.5
            estimated:
              C32_methods_any_of: ["[CPD]", "[XEN]", "[GTM]", "[BSR]"]
              penalty: -0.6

      missing_metadata:
        required_C_fields: ["C31", "C32", "C37"]
        rule: "apply_max_penalty_for_unresolvable_case_and_flag_x"

    # -------------------------
    # Thermal conductivity (TC-score)
    # -------------------------
    conductivity:
      start_value: 1.0

      # ---------- TC GATE ----------
      gate_interval_depth_reported:
        required_C_fields: ["C4", "C5"]
        if_missing:
          tc_score_fixed: 0.1
          stop_scoring: true

      blocks:

        # Block 1 — Localization
        location:
          C_field: "C42"
          mapping:
            "[Actual heat-flow location]": 0.0
            "[Other location]": -0.1
            "[Literature/unspecified]": -0.2

        # Block 2 — Source type
        source_type:
          C_field: "C41"
          mapping:
            "[In-situ probe]": 0.1
            "[Core-log integration]": 0.1
            "[Core samples]": 0.0
            "[Cutting samples]": -0.1
            "[Outcrop samples]": -0.1
            "[Well-log interpretation]": -0.1
            "[Mineral computation]": -0.2
            "[Assumed from literature]": -0.2

        # Block 3 — Number of conductivities
        number_of_conductivities:
          C_field: "C47"
          apply_only_if:
            C42_tc_location: "!=[Literature/unspecified]"
          mapping:
            ">15": 0.0
            "1-15": -0.1
            "unspecified_or_missing": -0.1

        # Block 4 — Saturation
        saturation:
          C_field: "C44"
          mapping:
            "[Saturated measured]": 0.0
            "[Saturated measured insitu]": 0.0
            "[Saturated calculated]": -0.1
            "[Recovered]": -0.1
            "[Dry measured]": -0.2

        # Block 5 — pT conditions
        pT_conditions:
          C_field: "C45"
          mapping:
            "[Actual in-situ (pT) conditions]": 0.0
            "[Replicated in-situ (pT)]": 0.0
            "[Corrected in-situ (pT)]": 0.0
            "[Replicated in-situ (p)]": -0.1
            "[Corrected in-situ (p)]": -0.1
            "[Replicated in-situ (T)]": -0.1
            "[Corrected in-situ (T)]": -0.1
            "[Recorded ambient pT conditions]": -0.2
            "[Unrecorded ambient pT conditions]": -0.2
            "[Unspecified]": -0.2

      missing_metadata:
        required_C_fields_after_gate:
          - "C42"
          - "C41"
          - "C47"
          - "C44"
          - "C45"
        rule: "apply_max_penalty_per_missing_block_and_flag_x"
