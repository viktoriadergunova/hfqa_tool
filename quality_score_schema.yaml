version: "1.0"
schema_id: "hf_quality:v1"
# Step A
# ===== UNCERTAINTY (U-SCORE) =====
# Based on Coefficient of Variation (COV% = [HFDUncertainty / |HFDValue|] * 100)
u_score:
  calculation:
    value_col: "C1"        # Child HF Value
    uncertainty_col: "C2" # Child HF Uncertainty
    site_name_col: "P3"
    relevance_col: "C9"
  thresholds:
    U1: 5.0                # < 5% (Excellent)
    U2: 15.0               # 5-15% (Good)
    U3: 25.0               # 15-25% (Acceptable)
    U4: 100.0              # > 25% (Poor)
    Ux: "missing"          # Data missing or not applicable
# Step B
# ===== METHODOLOGICAL (M-SCORE) =====

m_score:
  base_value: 1.0
  thresholds:                    # Final score = T_score * TC_score
    M1: 0.75                     # >= 0.75
    M2: 0.50                     # 0.50 - 0.75
    M3: 0.25                     # 0.25 - 0.50
    M4: 0.00                     # < 0.25
    missing_suffix: "x"          # append if any required metadata missing/unspecified

  borehole_logic:

    # -------------------------
    # Temperature gradient (T-score) — Borehole/Mine
    # Relevant DB fields:
    #   C31 = T_method_top
    #   C32 = T_method_bottom
    #   C37 = T_number
    # (C33/C34/C35/C36 exist but are NOT used in Table 3 scoring)
    # -------------------------
    temperature:
      start_value: 1.0

      cases:

        # Case 1: Continuous T log
        # Condition: C37 (T_number) > 3
        continuous_log:
          when:
            C37_T_number: ">3"
          rules:
            equilibrium_or_corrected:
              methods_any_of: ["[LOGeq]", "[cLOG]", "[DTSeq]", "[cDTS]"]  # via C31/C32
              penalty: 0.1
            perturbed:
              methods_any_of: ["[LOGpert]"]                               # via C31/C32
              penalty: -0.1

        # Case 2: Multiple single T point
        multiple_single_points:
          when: {}  # default if not continuous_log and not single+surface case
          rules:
            equilibrium_or_corrected:
              methods_any_of:
                - "[LOGeq]"     # via C31/C32
                - "[cLOG]"
                - "[DTSeq]"
                - "[cDTS]"
                - "[BHT]"
                - "[DST]"
                - "[RTDeq]"
                - "[RTDc]"
                - "[ODTT-PC]"
                - "[ODTT-TP]"
              penalty: -0.1
            perturbed:
              methods_any_of:
                - "[LOGpert]"
                - "[DTSpert]"
                - "[BHT]"
                - "[DST]"
                - "[RTDpert]"
                - "[BLK]"
              penalty: -0.3
            estimated:
              methods_any_of: ["[CPD]", "[XEN]", "[GTM]", "[BSR]"]
              penalty: -0.5

        # Case 3: One single T point + surface T
        # Condition: C31 (T_method_top) == [SUR]
        one_single_point_plus_surface_T:
          when:
            C31_T_method_top: "==[SUR]"
          rules:
            equilibrium_or_corrected:
              methods_any_of:
                - "[cBHT]"      # via C32 typically; C31 is [SUR]
                - "[cDST]"
                - "[RTDeq]"
                - "[RTDc]"
                - "[ODTT-PC]"
                - "[ODTT-TP]"
              penalty: -0.3
            perturbed:
              methods_any_of: ["[BHT]", "[DST]", "[RTDpert]"]
              penalty: -0.5
            estimated:
              methods_any_of: ["[CPD]", "[XEN]", "[GTM]", "[BSR]"]
              penalty: -0.6

      missing_metadata:
        required_C_fields: ["C31", "C32", "C37"]
        rule: "apply_max_penalty_for_unresolvable_case_and_flag_x"

    # -------------------------
    # Thermal conductivity (TC-score) — Borehole/Mine
    # Relevant DB fields:
    #   Gate: C04 = q_top, C05 = q_bottom  (interval depth reported?)
    #   C42 = tc_location
    #   C41 = tc_source
    #   C47 = tc_number
    #   C44 = tc_saturation
    #   C45 = tc_pT_conditions
    # -------------------------
    conductivity:
      start_value: 1.0

      gate_interval_depth_reported:
        required_C_fields: ["C04", "C05"]         # q_top, q_bottom
        if_missing:
          tc_score_fixed: 0.1
          stop_scoring: true

      blocks:

        # Block 1: Localization (C42)
        location:
          C_field: "C42"
          mapping:
            "[Actual heat-flow location]": 0.0
            "[Other location]": -0.1
            "[Literature/unspecified]": -0.2

        # Block 2: Source type (C41)
        source_type:
          C_field: "C41"
          mapping:
            "[In-situ probe]": 0.1
            "[Core-log integration]": 0.1
            "[Core samples]": 0.0
            "[Cutting samples]": -0.1
            "[Outcrop samples]": -0.1
            "[Well-log interpretation]": -0.1
            "[Mineral computation]": -0.2
            "[Assumed from literature]": -0.2

        # Block 3: Number of conductivities (C47), only if C42 != [Literature/unspecified]
        number_of_conductivities:
          C_field: "C47"
          apply_only_if:
            C42_tc_location: "!=[Literature/unspecified]"
          mapping:
            ">15": 0.0
            "1-15": -0.1
            "unspecified_or_missing": -0.1

        # Block 4: Saturation (C44)
        saturation:
          C_field: "C44"
          mapping:
            "[Saturated measured]": 0.0
            "[Saturated measured insitu]": 0.0
            "[Saturated calculated]": -0.1
            "[Recovered]": -0.1
            "[Dry measured]": -0.2

        # Block 5: pT conditions (C45)
        pT_conditions:
          C_field: "C45"
          mapping:
            "[Actual in-situ (pT) conditions]": 0.0
            "[Replicated in-situ (pT)]": 0.0
            "[Corrected in-situ (pT)]": 0.0
            "[Replicated in-situ (p)]": -0.1
            "[Corrected in-situ (p)]": -0.1
            "[Replicated in-situ (T)]": -0.1
            "[Corrected in-situ (T)]": -0.1
            "[Recorded ambient pT conditions]": -0.2
            "[Unrecorded ambient pT conditions]": -0.2
            "[Unspecified]": -0.2

      missing_metadata:
        required_C_fields_after_gate: ["C42", "C41", "C47", "C44", "C45"]
        rule: "apply_max_penalty_per_missing_block_and_flag_x"
