# Heat-Flow Database - FULL SCHEMA (ALL IDs)
version: "1.0"
name: "heat_flow_db_complete"

core:
  ID:
    dtype: intege
    unique: true
    min: 1
  Obligation:
    allowed: ["M", "R", "O", "-"]
  Level:
    allowed: ["Parent", "Child", "Admin"]

columns:
  # PARENT LEVEL (Pxx)
  P02:
    range: [0, 999999.9]
    obligation: "M"
  P04:
    range: [-90.0, 90.0]
    obligation: "M"
  P05:
    range: [-180.0, 180.0]
    obligation: "M"
  P07:
    range: [-12000, 9000]
    obligation: "M"
  P09:
    allowed: ["[Onshore (continental)]", "[Offshore (marine)]"]
    obligation: "M"
  P11:
    allowed: ["Yes", "No", "[unspecified]"]
    obligation: "R"
  P12:
    range: [-12000, 9000]
    obligation: "R"
  P13:
    range: [-12000, 9000]
    obligation: "R"
  P14:
    allowed: ["[Probing (offshore/ocean)]", "[Drilling-Clustering]"]
    obligation: "R"

  # CHILD LEVEL (Cxx)
  C01:
    range: [-999999.9, 999999.9]
    obligation: "M"
  C02:
    range: [0, 999999.9]
    obligation: "M"
