version: "1.0"
schema_id: "heatflow:v1"
name: "heat_flow_db_complete"

core:
  ID:
    dtype: int64
    unique: true
    min: 1
  Obligation:
    dtype: string
    allowed: ["M", "R", "O", "-"]
  Level:
    dtype: string
    allowed: ["Parent", "Child", "Admin"]

columns:
  # ===== PARENT LEVEL (Pxx) =====
  P01:
    dtype: float64
    range: [-999999.9, 999999.9]
    obligation: "M"
    comment: "HF Value"

  P02:
    dtype: float64
    range: [0.0, 999999.9]
    obligation: "M"
    comment: "HF Uncertainty"

  P03:
    dtype: string
    obligation: "M"
    comment: "Name"
    # normalization: { trim: true, collapse_space: true }
    # string_constraints: { max_length: 200 }

  P04:
    dtype: float64
    range: [-90.0, 90.0]
    obligation: "M"
    comment: "Latitude"

  P05:
    dtype: float64
    range: [-180.0, 180.0]
    obligation: "M"
    comment: "Longitude"

  P06:
    dtype: float64
    range: [-12000.0, 9000.0]
    obligation: "M"
    comment: "Elevation"

  P07:
    dtype: list[string]
    allowed:
      - "[Onshore (continental)]"
      - "[Onshore (lake-river-etc.)]"
      - "[Offshore (continental)]"
      - "[Offshore (marine)]"
      - "[Other (specify in comments)]"
      - "[unspecified]"
    obligation: "M"
    multi_choice: true
    separator: ";"
    comment: "Location Type (multi-select)"

  P08:
    dtype: string
    obligation: "M"
    comment: "Comments (Parent level)"

  P09:
    dtype: string
    allowed: ["Yes", "No", "[unspecified]"]
    obligation: "R"
    comment: "Correction HP"

  P10:
    dtype: float64
    range: [-12000.0, 9000.0]
    obligation: "R"
    comment: "Total MD"

  P11:
    dtype: float64
    range: [-12000.0, 9000.0]
    obligation: "R"
    comment: "TVD"

  P12:
    dtype: list[string]
    allowed:
      - "[Drilling]"
      - "[Mining]"
      - "[Tunneling]"
      - "[Probing (onshore-lake-river-etc.)]"
      - "[Probing (offshore-ocean)]"
      - "[Drilling-Clustering]"
      - "[Probing-Clustering]"
      - "[Indirect (GTM-BSR-CPD-etc.)]"
      - "[Other (specify in comments)]"
      - "[unspecified]"
    obligation: "M"
    multi_choice: true
    separator: ";"
    comment: "Type of Exploration Method (multi-select)"

  P13:
    dtype: list[string]
    allowed:
      - "[Hydrocarbon]"
      - "[Underground storage]"
      - "[Geothermal]"
      - "[Groundwater]"
      - "[Mapping]"
      - "[Research]"
      - "[Mining]"
      - "[Tunneling]"
      - "[Other (specify in comments)]"
      - "[unspecified]"
    obligation: "R"
    multi_choice: true
    separator: ";"
    comment: "Exploration Purpose (multi-select)"

  
  # ===== CHILD LEVEL (Cxx) =====
C01:
  dtype: float64
  range: [-999999.9, 999999.9]
  obligation: "M"
  comment: "HF Value (Child level)"

C02:
  dtype: float64
  range: [0.0, 999999.9]
  obligation: "R"
  comment: "HF Uncertainty (Child level)"

C03:
  dtype: list[string]
  allowed:
    - "[Interval method]"
    - "[Bullard method]"
    - "[Boot-strapping method]"
    - "[Other numerical computations]"
    - "[Other (specify in comments)]"
    - "[unspecified]"
  obligation: "M"
  multi_choice: true
  separator: ";"
  comment: "HF Method (multi-select)"

C04:
  dtype: float64
  range: [0.0, 19999.9]
  obligation: "M"
  comment: "HF Interval Top"

C05:
  dtype: float64
  range: [0.0, 19999.9]
  obligation: "M"
  comment: "HF Interval Bottom"

C06:
  dtype: float64
  range: [0.0, 999.9]
  obligation: "M"
  comment: "Penetration Depth"

C07:
  dtype: string
  obligation: "M"
  comment: "Primary publication reference (multi-entry)"

C08:
  dtype: string
  obligation: "R"
  comment: "Primary reference (multi-entry)"

C09:
  dtype: string
  allowed:
    - "[Yes]"
    - "[No]"
  obligation: "M"
  comment: "Relevant Child"

C10:
  dtype: string
  obligation: "R"
  comment: "Comments (Child level)"

C11:
  dtype: string
  allowed:
    - "[Considered - p]"
    - "[Considered - T]"
    - "[Considered - pT]"
    - "[Not considered]"
    - "[unspecified]"
  obligation: "M"
  multi_choice: true
  separator : ";"
  comment: "Flag: situ thermal properties considered (p, T, pT)"

C12:
  dtype: string
  allowed:
    - "[Tilt corrected]"
    - "[Drift corrected]"
    - "[Not corrected]"
    - "[Corrected (specify in comments)]"
    - "[unspecified]"
  obligation: "M"
  multi_choice: true
  separator : ";"
  comment: "Flag: temperature corrections"

C13:
  dtype: string
  allowed:
    - "[Present and corrected]"
    - "[Present and not corrected]"
    - "[Present not significant]"
    - "[Not recognized]"
    - "[unspecified]"
  obligation: "R"
  multi_choice: true
  seperator: ";"
  comment: "Flag: sedimentation corrections"

C14:
  dtype: string
  allowed:
    - "[Present and corrected]"
    - "[Present and not corrected]"
    - "[Present not significant]"
    - "[Not recognized]"
    - "[unspecified]"
  obligation: "R"
  multi_choice: true
  seperator: ";"
  comment: "Flag: erosion corrections"

C15:
  dtype: string
  allowed:
    - "[Present and corrected]"
    - "[Present and not corrected]"
    - "[Present not significant]"
    - "[Not recognized]"
    - "[unspecified]"
  obligation: "M"
  multi_choice: true
  seperator: ";"
  comment: "Flag: topographic corrections"

C16:
  dtype: string
  allowed:
    - "[Present and corrected]"
    - "[Present and not corrected]"
    - "[Present not significant]"
    - "[Not recognized]"
    - "[unspecified]"
  obligation: "M"
  multi_choice: true
  seperator: ";"
  comment: "Flag: paleoclimatic corrections"

C17:
  dtype: string
  allowed:
    - "[Present and corrected]"
    - "[Present and not corrected]"
    - "[Present not significant]"
    - "[Not recognized]"
    - "[unspecified]"
  obligation: "M"
  multi_choice: true
  seperator: ";"  
  comment: "Flag: transient corrections"

  C18:
  dtype: string
  allowed:
    - "[Present and corrected]"
    - "[Present and not corrected]"
    - "[Present not significant]"
    - "[Not recognized]"
    - "[unspecified]"
  obligation: "M"
  multi_choice: true
  separator: ";"
  comment: "Flag: convection processes corrections"

  C19:
  dtype: string
  allowed:
    - "[Present and corrected]"
    - "[Present and not corrected]"
    - "[Present not significant]"
    - "[Not recognized]"
    - "[unspecified]"
  obligation: "M"
  multi_choice: true
  separator: ";"
  comment: "Flag: heat refraction effets corrections"
C20:
  dtype: list[string]
  allowed:
    - "[Expedition-Cruise number]"
    - "[R/V Ship]"
    - "[D/V Platform]"
    - "[D/V Glomar Challenger]"
    - "[D/V JOIDES Resolution]"
    - "[Other (specify in comments)]"
    - "[unspecified]"
  obligation: "R"
  multi_choice: true
  separator: ";"
  comment: "Platform, vessel, or expedition"

C21:
  dtype: list[string]
  allowed:
    - "[Single Steel probe (Bullard)]"
    - "[Single Steel probe (Bullard) in-situ TC]"
    - "[Violin-Bow probe (Lister)]"
    - "[Outrigger probe (Von Herzen) in-situ TC]"
    - "[Outrigger probe (Haenel) in-situ TC]"
    - "[Outrigger probe (Ewing) with corer]"
    - "[Outrigger probe (Ewing) without corer]"
    - "[Outrigger probe (Lister) with corer]"
    - "[Outrigger probe (autonomous) without corer]"
    - "[Outrigger probe (autonomous) with corer]"
    - "[Submersible probe]"
    - "[Other (specify in comments)]"
    - "[unspecified]"
  obligation: "R"
  multi_choice: true
  separator: ";"
  comment: "Probe type"

C22:
  dtype: float64
  range: [0.0, 99.9]
  obligation: "R"
  comment: "Probe length"

C23:
  dtype: float64
  range: [0.0, 99.9]
  obligation: "M"
  comment: "Probe tilt"

C24:
  dtype: float64
  range: [-273.15, 999.99]
  obligation: "O"
  comment: "Bottom water temperature"

